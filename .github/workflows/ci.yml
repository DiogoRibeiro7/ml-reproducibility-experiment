name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install canonical runtime
        run: |
          python -m pip install -r environment/requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Install development checks
        run: |
          python -m pip install \
            pytest==9.0.2 \
            ruff==0.12.12 \
            mypy==1.17.1 \
            pandas-stubs==2.2.3.250527 \
            types-PyYAML==6.0.12.20260815
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest
      - name: Verify generated governance audit
        run: python scripts/render_governance_audit.py --check
      - name: Verify smoke design lock
        run: ml-repro --root . verify-design-lock --config configs/smoke.yml
      - name: Execute smoke study
        run: ml-repro --root . run-all --config configs/smoke.yml
      - name: Enforce smoke release gate
        run: ml-repro --root . release-status --config configs/smoke.yml
